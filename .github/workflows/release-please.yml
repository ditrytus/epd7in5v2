name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Keeps a release pull request open and up to date with every Conventional
      # Commit that lands on main. Merging that PR writes CHANGELOG.md, tags the
      # commit, and publishes the GitHub Release. For a Go module the tag is the
      # release: proxy.golang.org picks it up on first request.
      #
      # NOTE ON THE TOKEN: with the default GITHUB_TOKEN, the release pull
      # request will not trigger the CI workflow, because events raised by
      # GITHUB_TOKEN do not start new workflow runs. If branch protection
      # requires the CI check, the release PR can then never satisfy it. Swap in
      # a fine-grained PAT as RELEASE_PLEASE_TOKEN to fix that properly.
      - uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
