name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to the same branch supersedes any run still in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race -cover ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Keep this version in step with GOLANGCI_LINT_VERSION in the Makefile, so
      # `make lint` and CI agree on what counts as clean.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  # The panel only ever runs on a Raspberry Pi, so the cross-builds are the ones
  # that would actually break. The package is pure Go, so no cgo toolchain is
  # needed for either target.
  cross-build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: armv7
            goarch: arm
            goarm: "7"
          - name: arm64
            goarch: arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: go build ./...

  # Single aggregate check for branch protection to require. Adding a job or a
  # matrix entry above then becomes blocking automatically, with no need to
  # update the branch rules.
  ci:
    name: CI
    if: always()
    needs: [test, lint, cross-build]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
